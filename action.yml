name: 'LicenseProof'
description: 'Scan your dependency tree for license conflicts and fail the build on the ones you care about.'
author: 'LicenseProof'

branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  path:
    description: 'Project path to scan, relative to the workspace. Must contain a package.json / lockfile (npm) or a Python manifest (PyPI).'
    required: false
    default: '.'
  fail-on:
    description: 'When to fail the job: conflict (default), review, or never.'
    required: false
    default: 'conflict'
  include-dev:
    description: 'Set to true to include devDependencies. Production dependencies only by default.'
    required: false
    default: 'false'
  project-license:
    description: 'SPDX id or expression for your own project, overriding the one in package.json. Set this if your manifest says UNLICENSED but you ship under something else.'
    required: false
    default: ''
  version:
    description: 'Version of the licenseproof npm package to run. Pinned by default; override only to test a newer release.'
    required: false
    default: '0.3.4'
  out:
    description: 'Directory for report.json and summary.md. Defaults to a directory under the runner temp dir, so your checkout stays clean.'
    required: false
    default: ''
  summary:
    description: 'Set to false to skip writing the report to the job summary.'
    required: false
    default: 'true'
  upload-artifact:
    description: 'Set to false to skip uploading the report as a build artifact.'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name of the uploaded artifact.'
    required: false
    default: 'licenseproof-report'
  artifact-retention-days:
    description: 'Days before the uploaded artifact expires. 0 uses the repository default, which is what actions/upload-artifact documents for this value.'
    required: false
    default: '0'

  # ── the optional paid report ───────────────────────────────────────────────
  # Leave license-key empty and nothing below this line runs: the free scan
  # above is the whole action, exactly as before. A secret that is not set
  # arrives here as an empty string, so a half-configured workflow degrades to
  # the free scan rather than failing.
  license-key:
    description: 'Your paid licenseproof key, to also generate the full report. Pass it from a secret (secrets.LICENSEPROOF_LICENSE_KEY), never as a literal. Leave empty for the free scan only.'
    required: false
    default: ''
  report-formats:
    description: 'Paid report formats to generate, comma-separated: html, pdf, notices, sbom-cyclonedx, sbom-spdx. Only used when license-key is set.'
    required: false
    default: 'html,pdf,notices,sbom-cyclonedx,sbom-spdx'
  report-out:
    description: 'Directory for the paid report artifacts. Defaults to a directory under the runner temp dir, so your checkout stays clean.'
    required: false
    default: ''
  report-artifact-name:
    description: 'Name of the uploaded paid-report artifact. Kept separate from artifact-name so the free report and the paid pack download independently.'
    required: false
    default: 'licenseproof-full-report'

outputs:
  outcome:
    description: 'pass or fail — whether the scan tripped the fail-on threshold.'
    value: ${{ steps.scan.outputs.outcome }}
  total-packages:
    description: 'Number of packages scanned.'
    value: ${{ steps.scan.outputs.total-packages }}
  conflict-count:
    description: 'Packages whose license conflicts with your project license.'
    value: ${{ steps.scan.outputs.conflict-count }}
  review-count:
    description: 'Packages needing a human look (not counting unknowns).'
    value: ${{ steps.scan.outputs.review-count }}
  unknown-count:
    description: 'Packages whose license could not be resolved.'
    value: ${{ steps.scan.outputs.unknown-count }}
  agpl-count:
    description: 'Packages carrying an AGPL networked-use obligation.'
    value: ${{ steps.scan.outputs.agpl-count }}
  report-path:
    description: 'Absolute path to the machine-readable report.json.'
    value: ${{ steps.scan.outputs.report-path }}
  summary-path:
    description: 'Absolute path to the Markdown summary.'
    value: ${{ steps.scan.outputs.summary-path }}
  report-generated:
    description: 'true when the paid report was generated. Empty when no license-key was supplied.'
    value: ${{ steps.report.outputs.report-generated }}
  report-dir:
    description: 'Absolute path to the directory holding the paid report artifacts. Empty when no license-key was supplied.'
    value: ${{ steps.report.outputs.report-dir }}

runs:
  using: 'composite'
  steps:
    # The whole behaviour lives in scripts/run.sh so that scripts/simulate.sh can
    # exercise the identical code path locally. Keep logic out of this file.
    - id: scan
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/run.sh"
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_INCLUDE_DEV: ${{ inputs.include-dev }}
        INPUT_PROJECT_LICENSE: ${{ inputs.project-license }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        # A boolean, NOT the key. run.sh only needs to know whether to print the
        # upsell; giving it the key would put secret material in a second place
        # for no gain.
        INPUT_HAS_LICENSE_KEY: ${{ inputs.license-key != '' }}

    # always() so the report still lands when the scan failed the job — that is
    # exactly the run you want the artifact for.
    - if: ${{ always() && inputs.upload-artifact == 'true' && steps.scan.outputs.report-path != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.scan.outputs.report-path }}
          ${{ steps.scan.outputs.summary-path }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: error

    # ── the optional paid report ───────────────────────────────────────────────
    #
    # always(), for the same reason the upload above uses it: the scan step
    # exits non-zero whenever the fail-on threshold trips, and "my build failed
    # the license gate" is precisely the run you want the full report for. The
    # report-path guard means a scan that died at exit 2 (bad input, no project)
    # does not drag a second, more confusing failure behind it.
    #
    # The key reaches report.sh ONLY through this env block, as
    # $LICENSEPROOF_KEY — the runner does not log env values, and nothing passes
    # it on a command line where `ps` could read it.
    - id: report
      if: ${{ always() && inputs.license-key != '' && steps.scan.outputs.report-path != '' }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/report.sh"
      env:
        LICENSEPROOF_KEY: ${{ inputs.license-key }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_INCLUDE_DEV: ${{ inputs.include-dev }}
        INPUT_PROJECT_LICENSE: ${{ inputs.project-license }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPORT_FORMATS: ${{ inputs.report-formats }}
        INPUT_REPORT_OUT: ${{ inputs.report-out }}

    - if: ${{ always() && inputs.upload-artifact == 'true' && steps.report.outputs.report-dir != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.report-artifact-name }}
        path: ${{ steps.report.outputs.report-dir }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: error
